name: turndown
version: 0.1.0.0
author: Moremi Vannak
maintainer: Moremi Vannak
github: rinn7e/haskell-package
homepage: https://github.com/rinn7e/haskell-package/tree/master/package/turndown-hs#readme
synopsis: HTML to Markdown, a port of the turndown JavaScript library
description: |
  Converts HTML to Markdown with the output of turndown 7.2.4
  (https://github.com/mixmark-io/turndown), character for character: the
  same DOM (an HTML5 parse), the same white space handling, rules, escaping
  and options. See README.md.
category: Text

extra-source-files:
  - README.md
  - LICENSE
  - test/golden/**/*
license: MIT
copyright: 2017 Dom Christie, 2026 Moremi Vannak

default-extensions:
  - BlockArguments
  - DerivingStrategies
  - DuplicateRecordFields
  - ImportQualifiedPost
  - LambdaCase
  - MultiWayIf
  - NamedFieldPuns
  - OverloadedRecordDot
  - OverloadedStrings

ghc-options:
  - -Weverything
  - -Wno-all-missed-specialisations
  - -Wno-implicit-prelude
  - -Wno-inferred-safe-imports
  - -Wno-missed-specialisations
  - -Wno-missing-import-lists
  - -Wno-missing-kind-signatures
  - -Wno-missing-local-signatures
  - -Wno-missing-safe-haskell-mode
  - -Wno-monomorphism-restriction
  - -Wno-prepositive-qualified-module
  - -Wno-missing-role-annotations
  - -Wno-missing-poly-kind-signatures
  - -Wno-safe
  - -Wno-unsafe

dependencies:
  - base >= 4.18 && < 5
  - text >= 2.0 && < 2.2

library:
  source-dirs: src
  dependencies:
    - containers >= 0.6 && < 0.8
    - zenacy-html >= 2.1 && < 2.2

tests:
  test:
    main: Main.hs
    source-dirs: test
    dependencies:
      - directory >= 1.3 && < 1.4
      - filepath >= 1.4 && < 1.6
      - tasty >= 1.4 && < 1.6
      - tasty-hunit >= 0.10 && < 0.11
      - turndown
